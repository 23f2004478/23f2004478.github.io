<style>
:root{--bg:#FAFAF7;--ink:#16181D;--muted:#5B6170;--accent:#2F6BE6;--border:#E6E6E1}
@media (prefers-color-scheme:dark){:root{--bg:#0F1115;--ink:#ECEDE8;--muted:#A0A6B3;--accent:#7FA3FF;--border:#2A2E38}}
*{box-sizing:border-box;margin:0}
body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:420px;width:100%}
.tag{font:500 12px ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--border);display:inline-block;padding:4px 10px;border-radius:999px;margin-bottom:20px}
h1{font-size:34px;line-height:1.15;margin-bottom:8px}
p{color:var(--muted);margin-bottom:28px}
nav{display:flex;flex-direction:column;gap:10px}
a{display:block;min-height:48px;padding:12px 16px;border:1px solid var(--border);border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
a:hover,a:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
</style>
</head>
