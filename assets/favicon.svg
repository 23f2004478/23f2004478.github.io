<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#2F6BE6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FCD34D"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Obsidian Rounded Tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- System Ambient Core Glow -->
  <circle cx="64" cy="64" r="50" fill="url(#coreGlow)"/>

  <!-- Outer System Corner Brackets -->
  <path d="M 18 36 L 18 18 L 36 18" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 110 36 L 110 18 L 92 18" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 18 92 L 18 110 L 36 110" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 110 92 L 110 110 L 92 110" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

  <!-- Diamond / Octagon Runic Ring -->
  <polygon points="64,16 112,64 64,112 16,64" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
  <circle cx="64" cy="64" r="42" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.4"/>

  <!-- Awakened Core Diamond -->
  <polygon points="64,28 100,64 64,100 28,64" fill="#0F172A" stroke="url(#cyanGrad)" stroke-width="2.5" filter="url(#neonGlow)"/>

  <!-- Inner Gold Core Spark -->
  <polygon points="64,38 90,64 64,90 38,64" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.9"/>
  <polygon points="64,48 80,64 64,80 48,64" fill="url(#goldGrad)" opacity="0.3"/>

  <!-- Monogram Glyph: "KB" Runic Precision Geometric Lettering -->
  <!-- K -->
  <path d="M 47 48 L 47 80 M 62 48 L 48 64 L 62 80" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
  <!-- B -->
  <path d="M 68 48 L 68 80 M 68 48 L 77 48 C 82 48, 84 52, 84 56 C 84 60, 81 64, 76 64 M 68 64 L 79 64 C 84 64, 86 68, 86 72 C 86 76, 83 80, 77 80 L 68 80" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Center Focal Spark -->
  <circle cx="64" cy="64" r="2" fill="#FFFFFF"/>
</svg>