<text x="18" y="347" font-size="14.5" font-weight="700"  letter-spacing="1" style="fill:var(--muted)">EPHEMERAL LEAF WORKERS (DEPTH 2), SPAWNED BY AN AGENT</text>
<rect x="20" y="361" width="266" height="56" rx="8"  stroke="var(--ink)" stroke-width="1.25" style="fill:var(--paper)"/>
<text x="153.0" y="385.5" text-anchor="middle" font-size="16" font-weight="600" style="fill:var(--ink)">Research and extraction</text>
<text x="153.0" y="404.5" text-anchor="middle" font-size="14.5" style="fill:var(--muted)">read only</text>
