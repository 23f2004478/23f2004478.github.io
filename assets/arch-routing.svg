<text x="225.0" y="975.5" text-anchor="middle" font-size="16" font-weight="600" style="fill:var(--ink)">Health audit, hourly</text>
<text x="225.0" y="994.5" text-anchor="middle" font-size="14.5" style="fill:var(--muted)">checks routing and drift</text>
<rect x="470" y="951" width="410" height="56" rx="8"  stroke="var(--ink)" stroke-width="1.25" style="fill:var(--paper)"/>
<text x="675.0" y="975.5" text-anchor="middle" font-size="16" font-weight="600" style="fill:var(--ink)">Gemini quality audit, monthly</text>
<text x="675.0" y="994.5" text-anchor="middle" font-size="14.5" style="fill:var(--muted)">flags defects in Gemini output</text></svg>
