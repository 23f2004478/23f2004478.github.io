<text x="443.0" y="864.5" text-anchor="middle" font-size="14.5" style="fill:var(--muted)">Sonnet 5.5 and Opus 5.5</text>
<rect x="600" y="821" width="266" height="56" rx="8"  stroke="var(--accent)" stroke-width="1.25" stroke-dasharray="4 3" style="fill:var(--paper)"/>
<text x="733.0" y="845.5" text-anchor="middle" font-size="16" font-weight="600" style="fill:var(--ink)">Fable</text>
<text x="733.0" y="864.5" text-anchor="middle" font-size="14.5" style="fill:var(--muted)">max effort, consult only</text>
<rect x="1" y="913" width="898" height="112" rx="12" style="fill:var(--box);stroke:var(--rule)"/>
