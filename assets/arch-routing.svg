<text x="340.0" y="267.0" text-anchor="middle" font-size="16" font-weight="600" style="fill:var(--ink)">Consulting</text>
<rect x="460" y="239" width="200" height="44" rx="8"  stroke="var(--ink)" stroke-width="1.25" style="fill:var(--paper)"/>
<text x="560.0" y="267.0" text-anchor="middle" font-size="16" font-weight="600" style="fill:var(--ink)">Infrastructure</text>
