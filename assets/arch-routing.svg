<text x="560.0" y="213.0" text-anchor="middle" font-size="16" font-weight="600" style="fill:var(--ink)">Finance</text>
<rect x="680" y="185" width="200" height="44" rx="8"  stroke="var(--ink)" stroke-width="1.25" style="fill:var(--paper)"/>
<text x="780.0" y="213.0" text-anchor="middle" font-size="16" font-weight="600" style="fill:var(--ink)">Personal ops</text>
