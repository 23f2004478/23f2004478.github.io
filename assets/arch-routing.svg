<text x="18" y="487" font-size="14.5" font-weight="700"  letter-spacing="1" style="fill:var(--muted)">MODEL LADDER: STOP AT THE FIRST YES</text>
<rect x="20" y="501" width="860" height="36" rx="6"  stroke="var(--accent)" stroke-width="1.5" style="fill:var(--paper)"/>
<text x="38" y="525" font-size="16" font-weight="700" style="fill:var(--accent)">1</text>
<text x="66" y="525" font-size="15.5" style="fill:var(--ink)">A script can do it</text>
<text x="862" y="525" text-anchor="end" font-size="15.5" font-weight="600" style="fill:var(--ink)">Script, zero LLM calls</text>
<rect x="20" y="543" width="860" height="36" rx="6"  stroke="var(--rule)" stroke-width="1" style="fill:var(--paper)"/>
<text x="38" y="567" font-size="16" font-weight="700" style="fill:var(--accent)">2</text>
<text x="66" y="567" font-size="15.5" style="fill:var(--ink)">Bulk read-only or known-shape work</text>
<text x="862" y="567" text-anchor="end" font-size="15.5" font-weight="600" style="fill:var(--ink)">Gemini 3.8 Flash, low</text>
<rect x="20" y="585" width="860" height="36" rx="6"  stroke="var(--rule)" stroke-width="1" style="fill:var(--paper)"/>
<text x="38" y="609" font-size="16" font-weight="700" style="fill:var(--accent)">3</text>
<text x="66" y="609" font-size="15.5" style="fill:var(--ink)">Edit a script can check</text>
<text x="862" y="609" text-anchor="end" font-size="15.5" font-weight="600" style="fill:var(--ink)">Gemini Flash, medium</text>
<rect x="20" y="627" width="860" height="36" rx="6"  stroke="var(--rule)" stroke-width="1" style="fill:var(--paper)"/>
<text x="38" y="651" font-size="16" font-weight="700" style="fill:var(--accent)">4</text>
<text x="66" y="651" font-size="15.5" style="fill:var(--ink)">Ungated edit, synthesis, software</text>
<text x="862" y="651" text-anchor="end" font-size="15.5" font-weight="600" style="fill:var(--ink)">Claude Sonnet 5.5</text>
<rect x="20" y="669" width="860" height="36" rx="6"  stroke="var(--rule)" stroke-width="1" style="fill:var(--paper)"/>
<text x="38" y="693" font-size="16" font-weight="700" style="fill:var(--accent)">5</text>
<text x="66" y="693" font-size="15.5" style="fill:var(--ink)">Critical judgment</text>
<text x="862" y="693" text-anchor="end" font-size="15.5" font-weight="600" style="fill:var(--ink)">Claude Opus 5.5</text>
<rect x="20" y="711" width="860" height="36" rx="6"  stroke="var(--rule)" stroke-width="1" style="fill:var(--paper)"/>
<text x="38" y="735" font-size="16" font-weight="700" style="fill:var(--accent)">6</text>
<text x="66" y="735" font-size="15.5" style="fill:var(--ink)">Novel or irreversible plan</text>
<text x="862" y="735" text-anchor="end" font-size="15.5" font-weight="600" style="fill:var(--ink)">Fable, max, consult only</text>
<line x1="450" y1="755" x2="450" y2="783"  stroke-width="1.5" marker-end="url(#rt-asset-a)" style="stroke:var(--ink)"/>
