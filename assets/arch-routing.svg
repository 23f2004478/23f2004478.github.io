<text x="443.0" y="385.5" text-anchor="middle" font-size="16" font-weight="600" style="fill:var(--ink)">Review</text>
<text x="443.0" y="404.5" text-anchor="middle" font-size="14.5" style="fill:var(--muted)">reads and reviews only</text>
<rect x="600" y="361" width="266" height="56" rx="8"  stroke="var(--ink)" stroke-width="1.25" style="fill:var(--paper)"/>
<text x="733.0" y="385.5" text-anchor="middle" font-size="16" font-weight="600" style="fill:var(--ink)">Writer</text>
<text x="733.0" y="404.5" text-anchor="middle" font-size="14.5" style="fill:var(--muted)">sole writer, if used</text>
