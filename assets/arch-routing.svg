<svg xmlns="http://www.w3.org/2000/svg" id="rt-asset" viewBox="0 0 900 1027" role="img" aria-labelledby="rt-asset-t rt-asset-d" style="font-family:var(--sans)"><style>svg{--paper:#F6F3EC;--box:#EFEBE3;--ink:#19181A;--muted:#5A5750;--rule:#D8D2C6;--accent:#1F5C4A;--sans:'Source Sans 3',Arial,sans-serif}@media(prefers-color-scheme:dark){svg{--paper:#151514;--box:#1D1D1B;--ink:#ECE7DC;--muted:#ADA79D;--rule:#3D3B38;--accent:#6FCBAB}}</style><title id="rt-asset-t">How a request is routed across models</title><desc id="rt-asset-d">A request reaches a hub that only triages and routes. Eight standing domain agents own the work. They spawn short-lived leaf workers. Each task takes the first rung of a six-step ladder that can do it: script, Gemini 3.8 Flash low, Gemini Flash medium behind a script gate, Claude Sonnet 5.5, Claude Opus 5.5, then Fable at maximum effort for consultation only. Models come from a 9router pool, Claude direct, and Fable. An hourly health audit and a monthly Gemini quality audit review the setup.</desc><defs><marker id="rt-asset-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" style="fill:var(--ink)"/></marker></defs><rect x="1" y="1" width="898" height="118" rx="12" style="fill:var(--box);stroke:var(--rule)"/>
<text x="18" y="25" font-size="14.5" font-weight="700"  letter-spacing="1" style="fill:var(--muted)">ENTRY AND HUB</text>
<rect x="20" y="35" width="220" height="66" rx="8"  stroke="var(--ink)" stroke-width="1.25" style="fill:var(--paper)"/>
<text x="130.0" y="64.5" text-anchor="middle" font-size="16" font-weight="600" style="fill:var(--ink)">Request</text>
<text x="130.0" y="83.5" text-anchor="middle" font-size="14.5" style="fill:var(--muted)">message or scheduled job</text>
<line x1="240" y1="68" x2="296" y2="68"  stroke-width="1.5" marker-end="url(#rt-asset-a)" style="stroke:var(--ink)"/>
<rect x="300" y="35" width="580" height="66" rx="8"  stroke="var(--accent)" stroke-width="2" style="fill:var(--paper)"/>
<text x="590.0" y="55.0" text-anchor="middle" font-size="16" font-weight="600" style="fill:var(--ink)">Hub (depth 0)</text>
<text x="590.0" y="74.0" text-anchor="middle" font-size="14.5" style="fill:var(--muted)">Triages and routes by task card</text>
<text x="590.0" y="93.0" text-anchor="middle" font-size="14.5" style="fill:var(--muted)">Never writes a domain artifact</text>
<line x1="450" y1="119" x2="450" y2="147"  stroke-width="1.5" marker-end="url(#rt-asset-a)" style="stroke:var(--ink)"/>
<rect x="1" y="147" width="898" height="148" rx="12" style="fill:var(--box);stroke:var(--rule)"/>
<text x="18" y="171" font-size="14.5" font-weight="700"  letter-spacing="1" style="fill:var(--muted)">8 STANDING DOMAIN AGENTS, ONE WRITER PER ARTIFACT</text>
<rect x="20" y="185" width="200" height="44" rx="8"  stroke="var(--ink)" stroke-width="1.25" style="fill:var(--paper)"/>
<text x="120.0" y="213.0" text-anchor="middle" font-size="16" font-weight="600" style="fill:var(--ink)">Academics</text>
<rect x="240" y="185" width="200" height="44" rx="8"  stroke="var(--ink)" stroke-width="1.25" style="fill:var(--paper)"/>
<text x="340.0" y="213.0" text-anchor="middle" font-size="16" font-weight="600" style="fill:var(--ink)">Career</text>
